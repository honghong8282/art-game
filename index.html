<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎨 미술 퀴즈 모음</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&family=Nanum+Myeongjo:wght@400;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f7f4ef;
    --surface: #ffffff;
    --border: rgba(0,0,0,0.10);
    --text: #1a1a1a;
    --text-muted: #6b6b6b;
    --purple: #534AB7;
    --purple-light: #EEEDFE;
    --purple-dark: #3C3489;
    --red: #e63946;
    --red-light: #fde8ea;
    --teal: #0F6E56;
    --teal-light: #E1F5EE;
  }

  body {
    font-family: 'Nanum Gothic', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem 3rem;
  }

  header {
    text-align: center;
    margin-bottom: 2.5rem;
  }

  header h1 {
    font-family: 'Nanum Myeongjo', serif;
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 0.4rem;
  }

  header p {
    font-size: 14px;
    color: var(--text-muted);
  }

  .cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.25rem;
    max-width: 660px;
    width: 100%;
  }

  @media (max-width: 520px) {
    .cards { grid-template-columns: 1fr; }
  }

  .quiz-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 16px;
    padding: 2rem 1.5rem;
    text-align: center;
    text-decoration: none;
    color: var(--text);
    transition: transform 0.18s, box-shadow 0.18s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.8rem;
    position: relative;
    overflow: hidden;
  }

  .quiz-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 32px rgba(0,0,0,0.10);
  }

  .quiz-card .card-icon {
    font-size: 52px;
    line-height: 1;
  }

  .quiz-card h2 {
    font-family: 'Nanum Myeongjo', serif;
    font-size: 18px;
    font-weight: 700;
  }

  .quiz-card p {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.7;
  }

  .badge-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    margin-top: 0.2rem;
  }

  .badge {
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 100px;
  }

  .badge-purple { background: var(--purple-light); color: var(--purple-dark); }
  .badge-teal   { background: var(--teal-light);   color: var(--teal); }
  .badge-red    { background: var(--red-light);     color: var(--red); }

  .btn-go {
    margin-top: 0.5rem;
    display: inline-block;
    padding: 10px 28px;
    border-radius: 8px;
    font-family: 'Nanum Gothic', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    border: none;
    cursor: pointer;
    transition: opacity 0.15s;
    text-decoration: none;
  }

  .btn-go:hover { opacity: 0.88; }
  .btn-purple { background: var(--purple); }
  .btn-red    { background: var(--red); }

  .accent-strip {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
  }

  .strip-purple { background: var(--purple); }
  .strip-red    { background: var(--red); }

  footer {
    margin-top: 3rem;
    font-size: 12px;
    color: var(--text-muted);
  }
</style>
</head>
<body>

<header>
  <h1>🎨 미술 퀴즈 모음</h1>
  <p>원하는 퀴즈를 선택해 시작하세요</p>
</header>

<div class="cards">

  <!-- 미술사 퀴즈 -->
  <div class="quiz-card">
    <div class="accent-strip strip-purple"></div>
    <div class="card-icon">🖼️</div>
    <h2>미술사 퀴즈</h2>
    <p>반 고흐, 피카소, 모네 등<br>서양 거장들의 작가·작품 퀴즈<br>+ 명화 부분 보기</p>
    <div class="badge-row">
      <span class="badge badge-purple">13문제</span>
      <span class="badge badge-teal">힌트 제공</span>
      <span class="badge badge-purple">명화 맞추기</span>
    </div>
    <a class="btn-go btn-purple" href="art-history-quiz.html">시작하기 →</a>
  </div>

  <!-- 줄리아 오피 퀴즈 -->
  <div class="quiz-card">
    <div class="accent-strip strip-red"></div>
    <div class="card-icon">
      <svg width="52" height="52" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <rect width="100" height="100" rx="50" fill="#e63946"/>
        <rect x="28" y="62" width="44" height="38" rx="8" fill="#1d1d1b"/>
        <ellipse cx="50" cy="44" rx="22" ry="25" fill="#f4d5bb"/>
        <ellipse cx="50" cy="22" rx="22" ry="14" fill="#1d1d1b"/>
        <circle cx="42" cy="44" r="3" fill="#1d1d1b"/>
        <circle cx="58" cy="44" r="3" fill="#1d1d1b"/>
        <path d="M44 54 Q50 59 56 54" stroke="#1d1d1b" stroke-width="2" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
    <h2>줄리아 오피 퀴즈</h2>
    <p>영국 미니멀리즘 아티스트<br>Julia Opie의 삶과 작품을<br>얼마나 알고 있나요?</p>
    <div class="badge-row">
      <span class="badge badge-red">10문제</span>
      <span class="badge badge-teal">해설 제공</span>
      <span class="badge badge-red">4지선다</span>
    </div>
    <a class="btn-go btn-red" href="julia-opie-quiz.html">시작하기 →</a>
  </div>

</div>

<footer>미술 퀴즈 모음 · 교육 목적으로 제작되었습니다</footer>

</body>
</html>
