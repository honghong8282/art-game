<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>도자기, 다시 빚다 — 형성평가</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#18160f;
    --ink-2:#221f17;
    --panel:#241f1f2b;
    --celadon:#5c8b78;
    --celadon-light:#a9c9b8;
    --celadon-glow:#7fb89c;
    --buncheong:#c9c0ac;
    --buncheong-dark:#3a3428;
    --baekja:#f7f3e8;
    --gold:#d1a94e;
    --clay:#a9714a;
    --red:#c1583f;
    --line: rgba(247,243,232,0.14);
    --shadow: 0 18px 40px rgba(0,0,0,0.45);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(1200px 600px at 50% -10%, #2a2418 0%, transparent 60%),
      radial-gradient(900px 500px at 90% 110%, #1e2a24 0%, transparent 55%),
      var(--ink);
    color:var(--baekja);
    font-family:'Noto Sans KR', sans-serif;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    width:100%;
    max-width:560px;
    min-height:100vh;
    padding:22px 18px 60px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  h1,h2,h3{font-family:'Noto Serif KR', serif; margin:0;}
  .eyebrow{
    font-size:12px;
    letter-spacing:0.22em;
    color:var(--celadon-light);
    text-transform:uppercase;
    font-weight:700;
  }
  /* ---------- Header / Kiln gauge ---------- */
  .topbar{
    display:flex;
    align-items:center;
    gap:14px;
    background:linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
    border:1px solid var(--line);
    border-radius: 22px;
    padding:14px 16px;
    box-shadow: var(--shadow);
  }
  .kiln-wrap{
    position:relative;
    width:58px; height:58px;
    flex:0 0 auto;
  }
  .kiln-flame{
    position:absolute; bottom:-6px; left:50%;
    transform:translateX(-50%);
    font-size:14px;
    filter: drop-shadow(0 0 6px rgba(209,169,78,0.8));
    animation: flicker 1.4s infinite ease-in-out;
  }
  @keyframes flicker{ 0%,100%{opacity:.6; transform:translateX(-50%) scale(1);} 50%{opacity:1; transform:translateX(-50%) scale(1.15);} }
  .vessel-clip{ width:58px; height:58px; }
  .gauge-fill{ transition: y 0.7s cubic-bezier(.2,.8,.2,1), height 0.7s cubic-bezier(.2,.8,.2,1); }
  .topbar .meta{flex:1; min-width:0;}
  .topbar .meta .title{font-size:15px; font-weight:700; color:var(--baekja);}
  .topbar .meta .sub{font-size:12px; color:#c9c2af; margin-top:2px;}
  .gallery{ display:flex; gap:4px; flex-wrap:wrap; max-width:70px; justify-content:flex-end;}
  .gallery span{font-size:15px;}

  /* ---------- Cards ---------- */
  .card{
    background:linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.015));
    border:1px solid var(--line);
    border-radius:26px;
    padding:22px;
    box-shadow: var(--shadow);
  }
  .hero{
    text-align:center;
    padding:34px 20px 28px;
  }
  .hero h1{ font-size:28px; font-weight:900; color:var(--baekja); line-height:1.35;}
  .hero h1 em{ font-style:normal; color:var(--celadon-glow);}
  .hero p{ color:#cfc8b4; font-size:14px; margin-top:10px; line-height:1.6;}

  .mode-grid{ display:flex; flex-direction:column; gap:12px; }
  .mode-card{
    display:flex; align-items:center; gap:14px;
    background:linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
    border:1px solid var(--line);
    border-radius: 55% 45% 48% 52% / 40% 42% 58% 60%;
    border-radius: 20px;
    padding:16px 18px;
    cursor:pointer;
    transition: transform .18s ease, border-color .18s ease, background .18s ease;
    text-align:left;
  }
  .mode-card:active{ transform: scale(0.98); }
  .mode-card:hover{ border-color: var(--celadon-light); background:linear-gradient(180deg, rgba(169,201,184,0.10), rgba(255,255,255,0.02)); }
  .mode-icon{
    width:48px; height:48px; flex:0 0 auto;
    border-radius: 60% 40% 55% 45% / 45% 55% 45% 55%;
    display:flex; align-items:center; justify-content:center;
    font-size:22px;
  }
  .mode-card .txt .name{ font-weight:700; font-size:16px; color:var(--baekja);}
  .mode-card .txt .desc{ font-size:12.5px; color:#c3bca7; margin-top:3px; line-height:1.5;}
  .m-quiz .mode-icon{ background:linear-gradient(145deg,#5c8b78,#3d6353); }
  .m-match .mode-icon{ background:linear-gradient(145deg,#c9a24b,#8f6f2c); }
  .m-order .mode-icon{ background:linear-gradient(145deg,#a9714a,#78502f); }
  .m-fill .mode-icon{ background:linear-gradient(145deg,#8f97a8,#565d6b); }

  /* ---------- Common game chrome ---------- */
  .game-header{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .back-btn{
    background:none; border:1px solid var(--line); color:#d9d3c2;
    padding:8px 12px; border-radius:999px; font-size:12.5px; cursor:pointer;
    font-family:inherit;
  }
  .back-btn:hover{ border-color:var(--celadon-light); color:var(--baekja);}
  .progress-pill{ font-size:12.5px; color:#c9c2af; background:rgba(255,255,255,0.06); padding:6px 12px; border-radius:999px;}
  .timerbar-wrap{ height:6px; border-radius:999px; background:rgba(255,255,255,0.08); overflow:hidden; margin-top:10px;}
  .timerbar{ height:100%; background:linear-gradient(90deg, var(--celadon), var(--gold)); width:100%; transition: width 0.2s linear;}

  .q-text{ font-family:'Noto Serif KR', serif; font-size:19px; line-height:1.5; color:var(--baekja); margin:18px 0 20px; font-weight:700;}
  .options{ display:flex; flex-direction:column; gap:10px;}
  .opt-btn{
    text-align:left;
    background:rgba(255,255,255,0.045);
    border:1px solid var(--line);
    color:var(--baekja);
    padding:14px 16px;
    border-radius:14px;
    font-size:14.5px;
    font-family:inherit;
    cursor:pointer;
    transition: all .15s ease;
  }
  .opt-btn:not(:disabled):hover{ border-color:var(--celadon-light); background:rgba(169,201,184,0.09);}
  .opt-btn.correct{ background:rgba(92,139,120,0.35); border-color:var(--celadon); }
  .opt-btn.wrong{ background:rgba(193,88,63,0.28); border-color:var(--red); }
  .opt-btn:disabled{ cursor:default; opacity:0.85; }
  .feedback{ margin-top:16px; font-size:13.5px; color:#cfc8b4; background:rgba(255,255,255,0.05); border-radius:12px; padding:12px 14px; line-height:1.6; border-left:3px solid var(--celadon);}
  .next-btn{
    margin-top:18px; width:100%; padding:14px; border-radius:14px; border:none;
    background:linear-gradient(135deg, var(--celadon), #3d6353);
    color:#fff; font-weight:700; font-size:14.5px; cursor:pointer; font-family:inherit;
  }
  .next-btn:hover{ filter:brightness(1.08); }

  /* ---------- Matching ---------- */
  .match-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; margin-top:16px;}
  .flip-card{
    aspect-ratio: 1/1.05;
    perspective:800px;
    cursor:pointer;
  }
  .flip-inner{ position:relative; width:100%; height:100%; transition: transform .5s; transform-style:preserve-3d;}
  .flip-card.flipped .flip-inner{ transform: rotateY(180deg); }
  .flip-card.matched .flip-inner{ transform: rotateY(180deg); }
  .flip-face{
    position:absolute; inset:0; backface-visibility:hidden;
    border-radius:12px; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:8px; font-size:12px; line-height:1.35;
  }
  .flip-front{ background:linear-gradient(145deg, var(--buncheong-dark), #241f17); border:1px solid var(--line); font-size:20px; color:var(--gold);}
  .flip-back{ background:linear-gradient(145deg, rgba(92,139,120,0.35), rgba(61,99,83,0.35)); border:1px solid var(--celadon); transform: rotateY(180deg); color:var(--baekja); font-weight:700;}
  .flip-card.matched .flip-back{ background:linear-gradient(145deg, rgba(209,169,78,0.35), rgba(143,111,44,0.35)); border-color:var(--gold);}
  .flip-card.shake .flip-inner{ animation: shakeAnim .4s; }
  @keyframes shakeAnim{ 0%,100%{transform:rotateY(180deg) translateX(0);} 25%{transform:rotateY(180deg) translateX(-6px);} 75%{transform:rotateY(180deg) translateX(6px);} }

  /* ---------- Ordering ---------- */
  .order-bank{ display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
  .order-chip{
    background:rgba(255,255,255,0.06); border:1px solid var(--line); color:var(--baekja);
    padding:10px 14px; border-radius:12px; font-size:13.5px; cursor:pointer; font-family:inherit;
  }
  .order-chip:hover{ border-color:var(--celadon-light);}
  .order-chip.used{ opacity:0.25; pointer-events:none;}
  .order-slots{ display:flex; flex-direction:column; gap:8px; margin-top:16px;}
  .order-slot{
    min-height:46px; border:1.5px dashed var(--line); border-radius:12px;
    display:flex; align-items:center; gap:10px; padding:0 14px; font-size:13.5px; color:#8d8770;
  }
  .order-slot.filled{ border-style:solid; border-color:var(--celadon-light); color:var(--baekja); background:rgba(92,139,120,0.12);}
  .order-slot .num{ font-family:'Noto Serif KR',serif; font-weight:900; color:var(--celadon-light); font-size:14px;}
  .order-actions{ display:flex; gap:10px; margin-top:16px;}
  .ghost-btn{ flex:1; background:none; border:1px solid var(--line); color:#d9d3c2; padding:12px; border-radius:12px; font-size:13.5px; cursor:pointer; font-family:inherit;}
  .ghost-btn:hover{ border-color:var(--celadon-light); color:var(--baekja);}

  /* ---------- Fill blank ---------- */
  .fill-input{
    width:100%; padding:14px 16px; border-radius:14px; margin-top:16px;
    background:rgba(255,255,255,0.05); border:1px solid var(--line); color:var(--baekja);
    font-size:15px; font-family:inherit;
  }
  .fill-input:focus{ outline:none; border-color:var(--celadon-light);}
  .hint-line{ font-size:12px; color:#a89f85; margin-top:8px;}

  /* ---------- Summary ---------- */
  .summary{ text-align:center; padding:10px 6px;}
  .summary .score{ font-family:'Noto Serif KR',serif; font-size:44px; font-weight:900; color:var(--gold); margin:14px 0 4px;}
  .summary .label{ color:#c9c2af; font-size:13px;}
  .summary-actions{ display:flex; gap:10px; margin-top:22px;}

  .toast{
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%);
    background:var(--gold); color:#241f17; font-weight:800; font-size:13px;
    padding:12px 20px; border-radius:999px; box-shadow:0 10px 30px rgba(0,0,0,0.5);
    opacity:0; pointer-events:none; transition: opacity .3s, transform .3s;
    white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   콘텐츠 데이터 — 청자 · 분청사기 · 백자 (도자기 단원)
========================================================= */
const QUIZ = [
  {q:"청자가 왕실과 귀족 문화 속에서 가장 화려하게 발달한 시대는?", opts:["고려","조선 전기","조선 후기","삼국시대"], a:0,
   fb:"청자는 화려함을 추구하던 고려 왕실과 상류층 귀족의 문화를 배경으로 발달했어요."},
  {q:"상감기법의 순서로 옳은 것은?", opts:["채워넣기 → 파내기 → 굽기","파내기 → 채워넣기 → 깎고 굽기","굽기 → 파내기 → 채워넣기","채워넣기 → 굽기 → 파내기"], a:1,
   fb:"조각칼로 문양을 파낸 뒤(음각), 백토·자토로 메우고, 겉면을 깎아 유약을 발라 구워냅니다."},
  {q:"청자 특유의 맑고 투명한 청록빛 유약의 이름은?", opts:["비취색","흑유","진사색","분채"], a:0,
   fb:"비취색(翡色) 유약은 청자 상감운학문 매병 등에서 은은하고 신비로운 색채를 만들어냅니다."},
  {q:"돼지털 붓으로 거칠게 발라 역동적인 붓자국을 남기는 분청사기 기법은?", opts:["인화","박지","귀얄","철화"], a:2,
   fb:"귀얄은 표면에 남는 거친 하얀 붓자국이 시각적 감별 포인트예요."},
  {q:"문양 도장을 반복해서 찍어 규칙적이고 촘촘한 무늬를 남기는 기법은?", opts:["조화","인화","상감","박지"], a:1,
   fb:"인화는 도장을 찍어 만든 규칙적인 꽃무늬 패턴이 특징입니다."},
  {q:"뾰족한 송곳으로 백토 층만 긁어내 아래의 회청색 흙을 드러내는 기법은?", opts:["조화(음각)","귀얄","철화","상감"], a:0,
   fb:"조화는 하얀 도화지(백토) 위를 연필로 긋듯 파고들어 회색 선을 드러내는 기법이에요."},
  {q:"배경을 깎아내어 하얀 문양만 남기고 강렬한 흑백 대비를 만드는 기법은?", opts:["박지","인화","귀얄","조화"], a:0,
   fb:"박지기법은 분청사기 박지연화문 편병처럼 대담한 흑백 대비를 만들어냅니다."},
  {q:"붓과 철분 안료로 검붉은(흑갈색) 그림을 그리는 분청사기 기법은?", opts:["상감","철화(선화)","조화","귀얄"], a:1,
   fb:"철화는 하얀 바탕 위에 자유롭게 그려진 검붉은 그림이 특징입니다."},
  {q:"백자가 국가의 철저한 관리 아래 생산된 지역은?", opts:["전라남도 강진","경기도 광주","계룡산","고흥"], a:1,
   fb:"경기도 광주의 관요(사옹원 분원)는 국가가 관리한 최고급 백자 공방이었습니다."},
  {q:"무늬를 넣지 않고 흙 본연의 순백색과 형태로 미감을 극대화하는 백자 기법은?", opts:["무문기법","접합기법","상감기법","박지기법"], a:0,
   fb:"무문기법은 성리학의 '검소함이 곧 덕'이라는 이념과 맞닿아 있어요."},
  {q:"흙을 길게 말아 쌓아 올려 그릇을 만드는 성형 기법은?", opts:["핀칭","코일링","물레성형","판성형"], a:1,
   fb:"코일링은 물레 없이도 흙가래를 쌓아 형태를 만드는 방법입니다."},
  {q:"청자 → 분청사기 → 백자의 시대 순서가 발달한 흐름으로 옳은 것은?", opts:["고려 → 조선 후기 → 조선 전기","조선 전기 → 고려 → 조선 후기","고려 → 조선 전기 → 조선 후기","조선 후기 → 조선 전기 → 고려"], a:2,
   fb:"청자(고려) → 분청사기(조선 전기) → 백자(조선 후기) 순으로 이어집니다."},
  {q:"'자유분방함, 소박함, 역동성'이 핵심 키워드로 꼽히는 도자기는?", opts:["청자","분청사기","백자","고려백자"], a:1,
   fb:"분청사기는 엄격한 규범이 사라진 틈에서 등장한 자유로운 미감을 지녔어요."},
  {q:"상감기법과 조화기법의 결정적인 차이는?", opts:["색을 바르는가 여부","다른 색 흙으로 채우는가 여부","가마의 온도","사용 지역"], a:1,
   fb:"상감은 파낸 자리에 다른 색 흙을 채워 넣지만, 조화는 백토 층만 긁어내 아래 흙을 드러냅니다."}
];

const MATCH_PAIRS = [
  {term:"귀얄", clue:"돼지털 붓으로 거칠게 바르기"},
  {term:"인화", clue:"문양 도장을 반복해서 찍기"},
  {term:"상감", clue:"파내고 다른 색 흙 채우기"},
  {term:"조화", clue:"송곳으로 뾰족하게 긁어내기"},
  {term:"박지", clue:"배경을 깎아 문양만 남기기"},
  {term:"철화", clue:"붓과 철분 안료로 그리기"}
];

const ORDER_ROUNDS = [
  {title:"청자 상감기법, 올바른 순서로 배열하세요.", steps:["파내기(음각)","채워 넣기","깎고 굽기"]},
  {title:"세 도자기를 시대 순서대로 배열하세요.", steps:["청자 (고려)","분청사기 (조선 전기)","백자 (조선 후기)"]},
  {title:"편병처럼 큰 백자를 만드는 접합 과정을 순서대로 배열하세요.", steps:["윗부분과 아랫부분 따로 성형","가운데를 이어 붙이기","가마에서 구워 완성"]}
];

const FILL_TERMS = [
  {clue:"청자 특유의 맑고 투명한 청록빛 유약", ans:["비취색"]},
  {clue:"파내고 다른 색 흙을 메워 넣는 청자의 장식 기법", ans:["상감기법","상감"]},
  {clue:"어깨가 넓고 아래로 좁아지는 안정감 있는 청자 그릇 형태", ans:["매병"]},
  {clue:"납작하게 눌러 넓은 면을 가진 분청사기 그릇 형태", ans:["편병"]},
  {clue:"배경을 깎아내 흰 문양만 남기는 분청사기 기법", ans:["박지","박지기법"]},
  {clue:"무늬 없이 순백색과 형태로 미감을 극대화하는 백자 기법", ans:["무문기법","무문"]},
  {clue:"위아래를 따로 만들어 이어 붙이는 백자의 성형 기법", ans:["접합기법","접합"]},
  {clue:"흙을 길게 말아 쌓아 올리는 성형 기법", ans:["코일링"]},
  {clue:"국가가 철저히 관리한 경기도 광주의 최고급 백자 공방", ans:["관요"]},
  {clue:"돼지털 붓으로 거칠게 발라 역동적인 자국을 남기는 분청사기 기법", ans:["귀얄"]}
];

/* =========================================================
   전역 상태 — 가마 게이지
========================================================= */
const GAUGE_MAX = 10;
let totalCorrect = 0;
let completedPieces = 0;

function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=>t.classList.remove('show'), 1800);
}

function addCorrect(n){
  n = n||1;
  totalCorrect += n;
  if(Math.floor(totalCorrect/GAUGE_MAX) > completedPieces){
    completedPieces = Math.floor(totalCorrect/GAUGE_MAX);
    showToast("🏺 도자기 한 점 완성! (" + completedPieces + "개째)");
  }
  renderKilnGauge();
}

/* =========================================================
   상단 가마 게이지 렌더
========================================================= */
function renderKilnGauge(){
  const holder = document.getElementById('kilnGaugeHolder');
  const galleryHolder = document.getElementById('galleryHolder');
  if(!holder) return;
  const pct = (totalCorrect % GAUGE_MAX) / GAUGE_MAX; // 0~1
  const fillH = 40 * pct;
  const fillY = 46 - fillH;
  holder.innerHTML = `
    <svg class="vessel-clip" viewBox="0 0 58 58" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="vesselShape">
          <path d="M22 6 h14 v6 c8 3 11 12 11 20 c0 12 -8 20 -18 20 s-18 -8 -18 -20 c0 -8 3 -17 11 -20 z"/>
        </clipPath>
        <linearGradient id="fillGrad" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stop-color="#3d6353"/>
          <stop offset="100%" stop-color="#a9c9b8"/>
        </linearGradient>
      </defs>
      <path d="M22 6 h14 v6 c8 3 11 12 11 20 c0 12 -8 20 -18 20 s-18 -8 -18 -20 c0 -8 3 -17 11 -20 z"
            fill="rgba(255,255,255,0.06)" stroke="rgba(247,243,232,0.35)" stroke-width="1"/>
      <g clip-path="url(#vesselShape)">
        <rect class="gauge-fill" x="0" y="${fillY}" width="58" height="${fillH}" fill="url(#fillGrad)"/>
      </g>
      <path d="M22 6 h14 v6 c8 3 11 12 11 20 c0 12 -8 20 -18 20 s-18 -8 -18 -20 c0 -8 3 -17 11 -20 z"
            fill="none" stroke="rgba(247,243,232,0.35)" stroke-width="1"/>
    </svg>
    <div class="kiln-flame">🔥</div>
  `;
  galleryHolder.innerHTML = Array.from({length: Math.min(completedPieces,6)}).map(()=>'<span>🏺</span>').join('') + (completedPieces>6? `<span style="font-size:11px;color:#c9c2af;">+${completedPieces-6}</span>`:'');
}

/* =========================================================
   1) 스피드 퀴즈
========================================================= */
let quizState = {};
function startQuiz(){
  quizState = { order: shuffle(QUIZ.map((_,i)=>i)), idx:0, correct:0, timer:null, timeLeft:20 };
  renderQuizQuestion();
}
function renderQuizQuestion(){
  clearInterval(quizState.timer);
  const container = document.getElementById('gameArea');
  const qi = quizState.order[quizState.idx];
  const q = QUIZ[qi];
  const optOrder = shuffle(q.opts.map((_,i)=>i));
  container.innerHTML = `
  <div class="card">
    ${gameHeader('⚡ 스피드 퀴즈', (quizState.idx+1)+' / '+quizState.order.length)}
    <div class="timerbar-wrap"><div class="timerbar" id="tbar" style="width:100%"></div></div>
    <div class="q-text">${q.q}</div>
    <div class="options" id="optWrap">
      ${optOrder.map(oi=>`<button class="opt-btn" data-oi="${oi}" onclick="answerQuiz(${qi},${oi})">${q.opts[oi]}</button>`).join('')}
    </div>
    <div id="fbArea"></div>
  </div>`;
  quizState.timeLeft = 20;
  quizState.timer = setInterval(()=>{
    quizState.timeLeft -= 0.2;
    const pct = Math.max(0, (quizState.timeLeft/20)*100);
    const bar = document.getElementById('tbar');
    if(bar) bar.style.width = pct+'%';
    if(quizState.timeLeft<=0){
      clearInterval(quizState.timer);
      answerQuiz(qi, -1);
    }
  }, 200);
}
function answerQuiz(qi, chosenOi){
  clearInterval(quizState.timer);
  const q = QUIZ[qi];
  const buttons = document.querySelectorAll('#optWrap .opt-btn');
  buttons.forEach(b=>{
    b.disabled = true;
    const oi = parseInt(b.dataset.oi);
    if(oi === q.a) b.classList.add('correct');
    else if(oi === chosenOi) b.classList.add('wrong');
  });
  const isCorrect = chosenOi === q.a;
  if(isCorrect){ quizState.correct++; addCorrect(1); }
  document.getElementById('fbArea').innerHTML = `
    <div class="feedback">${isCorrect? '✅ 정답입니다!' : (chosenOi===-1? '⏰ 시간 초과!':'❌ 아쉬워요.')} ${q.fb}</div>
    <button class="next-btn" onclick="nextQuiz()">${quizState.idx+1 < quizState.order.length ? '다음 문제 →' : '결과 보기 →'}</button>
  `;
}
function nextQuiz(){
  quizState.idx++;
  if(quizState.idx >= quizState.order.length){
    renderSummary({
      title:'스피드 퀴즈 완료!',
      correct: quizState.correct,
      total: quizState.order.length,
      extra: quizState.correct===quizState.order.length ? '전 문제 정답! 도자기 장인이네요 🏺' : '틀린 부분은 학습지를 다시 살펴봐요.',
      onRetry: startQuiz
    });
  } else {
    renderQuizQuestion();
  }
}

/* =========================================================
   2) 카드 매칭
========================================================= */
let matchState = {};
function startMatch(){
  const cards = [];
  MATCH_PAIRS.forEach((p,idx)=>{
    cards.push({key:idx, type:'term', label:p.term});
    cards.push({key:idx, type:'clue', label:p.clue});
  });
  matchState = { cards: shuffle(cards), flipped: [], matchedCount:0, locked:false, moves:0 };
  renderMatch();
}
function renderMatch(){
  const container = document.getElementById('gameArea');
  container.innerHTML = `
  <div class="card">
    ${gameHeader('🎴 분청사기 기법 짝맞추기', matchState.matchedCount+' / '+MATCH_PAIRS.length+' 짝')}
    <p style="font-size:12.5px;color:#c9c2af;margin:6px 0 0;">카드 두 장을 뒤집어 기법 이름과 특징을 짝지어보세요.</p>
    <div class="match-grid" id="matchGrid">
      ${matchState.cards.map((c,i)=>`
        <div class="flip-card" id="mc-${i}" onclick="flipCard(${i})">
          <div class="flip-inner">
            <div class="flip-face flip-front">🏺</div>
            <div class="flip-face flip-back">${c.label}</div>
          </div>
        </div>
      `).join('')}
    </div>
    <div id="matchDone"></div>
  </div>`;
}
function flipCard(i){
  if(matchState.locked) return;
  const c = matchState.cards[i];
  const el = document.getElementById('mc-'+i);
  if(el.classList.contains('flipped') || el.classList.contains('matched')) return;
  if(matchState.flipped.length===2) return;

  el.classList.add('flipped');
  matchState.flipped.push(i);

  if(matchState.flipped.length===2){
    matchState.moves++;
    const [i1,i2] = matchState.flipped;
    const c1 = matchState.cards[i1], c2 = matchState.cards[i2];
    const isMatch = c1.key===c2.key && c1.type!==c2.type;
    matchState.locked = true;
    setTimeout(()=>{
      const el1 = document.getElementById('mc-'+i1), el2 = document.getElementById('mc-'+i2);
      if(isMatch){
        el1.classList.add('matched'); el2.classList.add('matched');
        matchState.matchedCount++;
        addCorrect(1);
        const pill = document.querySelector('.progress-pill');
        if(pill) pill.textContent = matchState.matchedCount+' / '+MATCH_PAIRS.length+' 짝';
        if(matchState.matchedCount === MATCH_PAIRS.length){
          renderSummary({
            title:'카드 짝맞추기 완료!',
            correct: MATCH_PAIRS.length,
            total: MATCH_PAIRS.length,
            extra: '총 시도 횟수: '+matchState.moves+'번',
            onRetry: startMatch
          });
        }
      } else {
        el1.classList.add('shake'); el2.classList.add('shake');
        setTimeout(()=>{
          el1.classList.remove('flipped','shake'); el2.classList.remove('flipped','shake');
        }, 500);
      }
      matchState.flipped = [];
      matchState.locked = false;
    }, 700);
  }
}

/* =========================================================
   3) 순서 배열
========================================================= */
let orderState = {};
function startOrder(){
  orderState = { round:0, correctRounds:0 };
  renderOrderRound();
}
function renderOrderRound(){
  const r = ORDER_ROUNDS[orderState.round];
  const bank = shuffle(r.steps.map((s,i)=>({label:s, correctIdx:i})));
  orderState.bank = bank;
  orderState.placed = [];
  const container = document.getElementById('gameArea');
  container.innerHTML = `
  <div class="card">
    ${gameHeader('🔢 순서 배열 챌린지', '라운드 '+(orderState.round+1)+' / '+ORDER_ROUNDS.length)}
    <div class="q-text" style="font-size:16px;">${r.title}</div>
    <div class="order-slots" id="slotWrap">
      ${r.steps.map((_,i)=>`<div class="order-slot" id="slot-${i}"><span class="num">${i+1}</span><span></span></div>`).join('')}
    </div>
    <div class="order-bank" id="bankWrap">
      ${bank.map((b,i)=>`<button class="order-chip" id="chip-${i}" onclick="placeChip(${i})">${b.label}</button>`).join('')}
    </div>
    <div class="order-actions">
      <button class="ghost-btn" onclick="undoChip()">↩️ 되돌리기</button>
      <button class="ghost-btn" onclick="checkOrder()">✅ 확인하기</button>
    </div>
    <div id="orderFb"></div>
  </div>`;
}
function placeChip(bankIdx){
  if(orderState.placed.length >= orderState.bank.length) return;
  const chip = document.getElementById('chip-'+bankIdx);
  if(chip.classList.contains('used')) return;
  chip.classList.add('used');
  orderState.placed.push(bankIdx);
  const slotIdx = orderState.placed.length - 1;
  const slot = document.getElementById('slot-'+slotIdx);
  slot.classList.add('filled');
  slot.querySelector('span:last-child').textContent = orderState.bank[bankIdx].label;
  slot.dataset.bankIdx = bankIdx;
}
function undoChip(){
  if(orderState.placed.length===0) return;
  const last = orderState.placed.pop();
  document.getElementById('chip-'+last).classList.remove('used');
  const slotIdx = orderState.placed.length;
  const slot = document.getElementById('slot-'+slotIdx);
  slot.classList.remove('filled');
  slot.querySelector('span:last-child').textContent = '';
  delete slot.dataset.bankIdx;
}
function checkOrder(){
  if(orderState.placed.length < orderState.bank.length){
    showToast('모든 칸을 채워주세요!');
    return;
  }
  let allCorrect = true;
  orderState.placed.forEach((bankIdx, slotIdx)=>{
    const isRight = orderState.bank[bankIdx].correctIdx === slotIdx;
    const slot = document.getElementById('slot-'+slotIdx);
    if(!isRight){ allCorrect=false; slot.style.borderColor = 'var(--red)'; }
    else slot.style.borderColor = 'var(--celadon)';
  });
  const fb = document.getElementById('orderFb');
  if(allCorrect){
    orderState.correctRounds++;
    addCorrect(1);
    fb.innerHTML = `<div class="feedback">✅ 정확해요! 순서를 완벽하게 이해하고 있네요.</div>
      <button class="next-btn" onclick="nextOrderRound()">${orderState.round+1 < ORDER_ROUNDS.length ? '다음 라운드 →' : '결과 보기 →'}</button>`;
  } else {
    fb.innerHTML = `<div class="feedback">❌ 순서가 아직 맞지 않아요. 빨간 칸을 다시 살펴보고 되돌리기로 고쳐보세요.</div>`;
  }
}
function nextOrderRound(){
  orderState.round++;
  if(orderState.round >= ORDER_ROUNDS.length){
    renderSummary({
      title:'순서 배열 챌린지 완료!',
      correct: orderState.correctRounds,
      total: ORDER_ROUNDS.length,
      extra: '한 번에 맞춘 라운드 수',
      onRetry: startOrder
    });
  } else {
    renderOrderRound();
  }
}

/* =========================================================
   4) 용어 빈칸 챌린지
========================================================= */
let fillState = {};
function startFill(){
  fillState = { order: shuffle(FILL_TERMS.map((_,i)=>i)), idx:0, correct:0 };
  renderFillQuestion();
}
function renderFillQuestion(){
  const container = document.getElementById('gameArea');
  const ti = fillState.order[fillState.idx];
  const t = FILL_TERMS[ti];
  container.innerHTML = `
  <div class="card">
    ${gameHeader('✍️ 용어 빈칸 챌린지', (fillState.idx+1)+' / '+fillState.order.length)}
    <div class="q-text" style="font-size:16px;">${t.clue}</div>
    <input type="text" class="fill-input" id="fillInput" placeholder="정답을 입력하세요" autocomplete="off">
    <div class="hint-line">💡 띄어쓰기 없이, 핵심 단어만 입력해도 정답 처리돼요.</div>
    <button class="next-btn" onclick="answerFill(${ti})">확인하기</button>
    <div id="fillFb"></div>
  </div>`;
  document.getElementById('fillInput').addEventListener('keydown', (e)=>{
    if(e.key==='Enter') answerFill(ti);
  });
  document.getElementById('fillInput').focus();
}
function answerFill(ti){
  const t = FILL_TERMS[ti];
  const inputEl = document.getElementById('fillInput');
  const raw = inputEl.value.trim().replace(/\s+/g,'');
  const isCorrect = t.ans.some(a => a.replace(/\s+/g,'') === raw) && raw.length>0;
  inputEl.disabled = true;
  if(isCorrect){ fillState.correct++; addCorrect(1); }
  document.getElementById('fillFb').innerHTML = `
    <div class="feedback">${isCorrect? '✅ 정답입니다!' : '❌ 정답: '+t.ans[0]}</div>
    <button class="next-btn" onclick="nextFill()">${fillState.idx+1 < fillState.order.length ? '다음 →' : '결과 보기 →'}</button>
  `;
  container_scrollIntoView();
}
function container_scrollIntoView(){ /* no-op placeholder for potential UX tweak */ }
function nextFill(){
  fillState.idx++;
  if(fillState.idx >= fillState.order.length){
    renderSummary({
      title:'용어 빈칸 챌린지 완료!',
      correct: fillState.correct,
      total: fillState.order.length,
      extra: '핵심 미술 용어를 얼마나 정확히 기억하나요?',
      onRetry: startFill
    });
  } else {
    renderFillQuestion();
  }
}
